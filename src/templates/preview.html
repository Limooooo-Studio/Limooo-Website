<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limooo 页面预览</title>
<style>
    html, body { margin: 0; padding: 0; background: #101114; color: #e2e2e3; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        padding: 48px 24px; max-width: 720px; margin: 0 auto;
        -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    p.desc { color: #9ca3af; font-size: 13px; margin: 0 0 32px; }
    h2 { font-size: 15px; font-weight: 600; margin: 28px 0 10px; color: #05A5A6; text-transform: uppercase; letter-spacing: 0.08em; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    li { margin: 0; }
    a {
        display: block; padding: 10px 14px; background: #202127; border: 1px solid #2e2e32;
        border-radius: 8px; color: #e2e2e3; text-decoration: none; font-size: 13px;
        transition: border-color 160ms ease, color 160ms ease;
    }
    a:hover { border-color: #05A5A6; color: #05A5A6; }
</style>
</head>
<body>
    <h1>Limooo 页面预览</h1>
    <p class="desc">所有子域页面（单语言），点击在本地浏览器中预览（图片/导航均为本地文件）。</p>
    <ul>
        {% for page in pages %}
        <li><a href="{{ page }}" target="_blank" rel="noopener">{{ page.replace('.html', '') }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
