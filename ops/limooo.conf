# 【访客统计子域名(visitor)】 -> 对应 Flask 的 /visitor 页面
server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name visitor.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    # 人机验证门禁：auth_request 校验 __gate cookie，未通过由 Flask 403 + error_page 302 到验证页
    error_page 403 = @gate_redirect;
    location @gate_redirect {
        return 302 https://auth.limooo.cn/__gate?host=$host&next=$request_uri;
    }
    # 人机验证门禁：auth_request 校验 __gate cookie，未通过由 Flask 302 到 auth.limooo.cn
    location = /__gate_check {
        internal;
        proxy_pass http://127.0.0.1:8080/__gate_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }
    auth_request /__gate_check;

    # 认证 / 登录 / 登出（走 Flask 根路由）
    location /login {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logout {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件直连 Flask 根路由（不走 /visitor 前缀）
    location /static/ {
        auth_request off;
        alias /var/www/limooo/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # API 请求（限流由 Flask 处理，已认证用户不限速）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他请求转发到 Flask 的 /visitor 视图
    location / {
        proxy_pass http://127.0.0.1:8080/visitor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }
}

# 【统一重定向】 -> 中间跳转页（title: Redirecting），登录/登出后经此跳转
server {
    listen 443 quic;
    listen 443 ssl;
