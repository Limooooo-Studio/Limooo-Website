# Claude 官方（Anthropic）webhook 出口网段：免人机验证
geo $http_cf_connecting_ip $claude_trusted {
    default 0;
    160.79.104.0/21 1;
}
# Limooo - VPS Nginx 最小配置
#
# 公开站点已迁移到 Cloudflare Pages，本配置只保留仍必须留在 VPS 的部分：
#   - admin.limooo.cn / authentik + /kuma 上的 Uptime Kuma
#   - identity.limooo.cn 兼容 301（DNS 中已移除独立记录）
#   - 内网 backchannel logout（Docker -> nginx -> Flask）
# Cloudflare 已移除 `*.limooo.cn` 通配记录，只显式保留
# admin.limooo.cn 与 Pages 使用的各子域；未点名的子域不会落到 VPS。

# ── 日志过滤：444（封禁断连）不写入 access log ──────────
map $status $loggable {
    444    0;
    default 1;
}

# ── 非浏览器访问拦截：默认 403，放行浏览器/搜索引擎/合法自动化 ──
# $ua_deny=1 表示非浏览器 UA，由 location-security.inc 统一 403
map $http_user_agent $ua_deny {
    default 1;
    ~*Mozilla 0;
    ~*(hstspreload-bot|Cloudflare-Healthchecks|UptimeRobot|GoogleOther|Google-Extended) 0;
    ~*(Googlebot|Bingbot|Baiduspider|YandexBot|DuckDuckBot|Slurp|Sogou|360Spider|Bytespider|PetalBot|YisouSpider|Applebot|facebookexternalhit|Twitterbot|Discordbot|TelegramBot|Slackbot|AdsBot|Exabot|ia_archiver|Yeti) 0;
}

# ── WebSocket 升级与 keepalive ───────────────────────────
map $http_upgrade $connection_upgrade_keepalive {
    default upgrade;
    '' '';
}

upstream authentik_backend {
    server 127.0.0.1:9000;
    keepalive 16;
}

proxy_cache_path /var/cache/nginx/authentik
    levels=1:2
    keys_zone=authentik:10m
    max_size=256m
    inactive=30d
    use_temp_path=off;

# ── 访问日志格式：combined + CF-Ray ──────────────────
log_format limooo_cf '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_cf_ray"';

# ── Cloudflare 真实 IP 透传 ──────────────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
