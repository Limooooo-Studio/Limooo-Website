    location / {
        proxy_pass http://127.0.0.1:8080/r$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 【图片子域名】 -> 只服务图片资源，不经 Flask、不过人机验证门禁
# DNS 靠 *.limooo.cn 通配 A 记录落到本机；URL 不带 /static 前缀，
# 例如 https://images.limooo.cn/portfolio/x.webp 直接对应
# /var/www/limooo/src/static/portfolio/x.webp。浏览器子资源请求不带
# __gate cookie，若有 auth_request 会 302 导致图片加载失败，故直接出文件。
server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name images.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    # 三个前端路径（SPA）：直接访问/刷新 /portfolio /qr-codes /icons 时
    # 也返回门面页 index.html（点击路径卡片是前端 pushState 跳转，这里保证
    # 直达与刷新不 403；具体图片文件仍由下方 location / 正常出）
    location ~ ^/(portfolio|qr-codes|icons)$ {
        root /var/www/limooo/src/static/;
        try_files /index.html =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # 图片直接由 nginx 出文件（30 天缓存，Cloudflare 边缘命中后几乎零回源）；
    # 根路径 `/` 出 src/static/index.html（images.limooo.cn 门面页）
    location / {
        alias /var/www/limooo/src/static/;
        index index.html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }
}

# 【authentik】 -> 认证服务（OIDC 身份提供者）
server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name identity.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    # 人机验证门禁：auth_request 校验 __gate cookie，未通过由 Flask 403 + error_page 302 到验证页
    error_page 403 = @gate_redirect;
    location @gate_redirect {
        return 302 https://auth.limooo.cn/__gate?host=$host&next=$request_uri;
    }
    # 人机验证门禁：auth_request 校验 __gate cookie，未通过由 Flask 302 到 auth.limooo.cn
    location = /__gate_check {
        internal;
        proxy_pass http://127.0.0.1:8080/__gate_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }
    auth_request /__gate_check;

    # 上传体积放宽（authentik 有文件上传场景）
    client_max_body_size 50m;

    # authentik OIDC 协议端点（authorize/token/jwks/userinfo/end-session）：
    # token 交换是 Pages Worker 服务端调用，不带 __gate cookie，若走门禁会 302
    # 导致登录回调 auth_failed；页面本身仍走 auth_request 门禁
    location /application/o/ {
        auth_request off;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # authentik 静态资源（不经门禁，避免子资源 302 循环）
    location /static/ {
        auth_request off;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # authentik 在 HTTPS 请求下硬编码发 SameSite=None 的 session cookie,
        # Safari ITP 会把该 cookie 当第三方追踪器整体屏蔽,导致登录后 cookie 不保留、
        # 无限重定向回登录页。这里改写为 lax(第一方 cookie,Safari 正常保留)。
        proxy_cookie_flags authentik_session samesite=lax;
    }
}

