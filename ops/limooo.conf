real_ip_header CF-Connecting-IP;

# ── 全局 TLS 安全配置 ────────────────────────────────
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# ── 基础性能与安全头优化 ──────────────────────────────
server_tokens off;
tcp_nopush on;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/wasm
    font/woff2
    image/svg+xml
    text/css
    text/plain;

# =========================================================
# 默认拒绝：未绑定域名的 HTTP/HTTPS 直接访问
# =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    include /etc/nginx/conf.d/location-security.inc;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    ssl_reject_handshake on;
}

# =========================================================
# identity.limooo.cn：只保留为 admin.limooo.cn 的兼容跳转
# =========================================================
server {
    listen 80;
    server_name identity.limooo.cn;
    include /etc/nginx/conf.d/location-security.inc;
    return 301 https://admin.limooo.cn$request_uri;
}

server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name identity.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    # 统一入口：identity 不再承载后端，直接 301 到 admin 同路径
    return 301 https://admin.limooo.cn$request_uri;

    # 人机验证门禁：auth_request 校验 __gate cookie
    error_page 403 = @gate_redirect;
    location @gate_redirect {
        return 302 https://auth.limooo.cn/__gate?host=$host&next=$request_uri;
    }
    location = /__gate_check {
        internal;
        proxy_pass http://127.0.0.1:8080/__gate_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }
    auth_request /__gate_check;

    client_max_body_size 50m;

    # OIDC 协议端点由 Pages Worker / authentik 服务端调用，不能套门禁
    location /application/o/ {
        auth_request off;
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    # Authentik 登录/用户界面与 API 由 Authentik 自身认证，不再套人机门禁
    location ^~ /if/ {
        auth_request off;
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/ {
        auth_request off;
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # authentik 静态资源（不经门禁，避免子资源 302 循环）
    location /static/ {
        auth_request off;
        proxy_pass http://authentik_backend;
        proxy_cache authentik;
        proxy_cache_key $host$request_uri;
        proxy_cache_valid 200 1y;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        proxy_hide_header X-Authentik-Version;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    # authentik 实时推送：必须走 HTTP/1.1 + Upgrade，否则会反复重连
    location = /_health {
        auth_request off;
        return 200 "ok\n";
    }

    location /ws/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_cookie_flags authentik_session samesite=lax;
    }
}

# =========================================================
# admin.limooo.cn（Authentik 管理后台 + 内嵌 Uptime Kuma）
# =========================================================
server {
    listen 80;
    server_name admin.limooo.cn;
    include /etc/nginx/conf.d/location-security.inc;
    return 301 https://admin.limooo.cn$request_uri;
}

server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name admin.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 25m;

    # Authentik SSO 子请求：由 Kuma 的通用 location 发起，
    # 必须使用 admin 域名 Host，让 Embedded Outpost 识别 provider。
    location = /__authentik_auth {
        internal;
        proxy_pass http://authentik_backend/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 未登录时到 Authentik 登录/SSO（该路径不经通用 Kuma 反向代理）
    error_page 401 = @authentik_signin;
    location @authentik_signin {
        internal;
        return 302 /outpost.goauthentik.io/start?rd=$request_uri;
    }

    location = /_health {
        return 200 "ok\n";
    }

    # ── Authentik 自身：以 identity 作为内部 Host，避免 Embedded Outpost
    #    按 external_host=admin.limooo.cn 拦截 Authentik 管理页 ──
    location = / {
        error_page 418 = @authentik_root_callback;
        if ($arg_X-authentik-auth-callback = "true") {
            return 418;
        }
        return 302 /if/admin/;
    }
    location @authentik_root_callback {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /if/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v3/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /static/ {
        proxy_pass http://authentik_backend;
        proxy_cache authentik;
        proxy_cache_key $host$request_uri;
        proxy_cache_valid 200 1y;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        proxy_hide_header X-Authentik-Version;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    location ^~ /media/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    location ^~ /help/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    location ^~ /ws/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /application/o/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    # Embedded Outpost 协议端点：必须保留 admin Host 供 SSO 使用
    location ^~ /outpost.goauthentik.io/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

# ── Uptime Kuma：挂载在 /kuma/，由 Authentik 子请求统一保护 ──
    location ^~ /kuma/ {
        auth_request /__authentik_auth;
        auth_request_set $ak_auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $ak_auth_cookie;
        proxy_pass http://127.0.0.1:3001/;
        proxy_redirect / /kuma/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余路径交给 Authentik，避免 /dashboard、/socket.io 等旧 Kuma 路径暴露
    location / {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host identity.limooo.cn;
        proxy_set_header X-Forwarded-Host admin.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# =========================================================
# 内网 backchannel logout：仅 Docker 网段/本机可达
# =========================================================
server {
    listen 0.0.0.0:8089;
    server_name _;

    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;

    location = /logout/backchannel {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host visitor.limooo.cn;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
    }
}



# =========================================================
# status.limooo.cn：Uptime Kuma + Kuma Mieru 状态页 + /claude 接收
# 人机验证：Turnstile(__gate) 用于状态页；/claude webhook 靠 ?token= 精确鉴权，展示界面公开
# =========================================================
server {
    listen 80;
    server_name status.limooo.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name status.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    # 人机验证门禁：校验 __gate cookie；缺失/无效则跳转 auth.limooo.cn Turnstile
    error_page 403 = @gate_redirect;
    location @gate_redirect {
        return 302 https://auth.limooo.cn/__gate?host=$host&next=$request_uri;
    }
    location = /__gate_check {
        internal;
        proxy_pass http://127.0.0.1:8080/__gate_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Claude 通知接收端 / 展示界面：POST 重定向到 /_claude_webhook(免验证)，GET 走 __gate 人机验证
    location /claude {
        client_max_body_size 1m;
        if ($request_method = POST) { rewrite ^ /_claude_webhook last; }
        auth_request /__gate_check;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host status.limooo.cn;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Claude webhook 通道：仅放行带正确 token 的 POST（免人机验证）
    location = /_claude_webhook {
        internal;
        client_max_body_size 1m;
        set $claude_deny 0;
        if ($request_method = POST) { set $claude_deny 1; }
        if ($arg_token = "aa14d3e1c307afc09e67418cb1179146539f4e75337c7b67cf4ad8c375b4c356") { set $claude_deny 0; }
        if ($claude_deny = 1) { return 401; }
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host status.limooo.cn;
