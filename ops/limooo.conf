# 【裸域名】 -> 由 Flask 在页面层跳转到 www（裸域 https 自身返回带 HSTS 的响应，
# 使浏览器为顶级域记录 HSTS，满足 hstspreload 要求）
server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    location /static/ {
        alias /var/www/limooo/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 【www】 -> 永久跳转到裸域 limooo.cn（统一主域入口，响应带 HSTS）
server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name www.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    return 301 https://limooo.cn$request_uri;
}

# 【内网 backchannel logout】仅 Docker/本机可达，绕过 CF 的 bot 挑战。
# authentik 的 logout_method=backchannel 会向 provider 的 logout_uri POST
# logout_token；经公网(CF)请求会被 cf-mitigated: challenge 拦截，故用
# host.docker.internal:8089 走 docker0 网桥内网直达 nginx，再转发 Flask。
server {
    listen 0.0.0.0:8089;
    server_name _;

    # 仅允许 Docker 网段与本机回环访问
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;

    location = /logout/backchannel {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host visitor.limooo.cn;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
    }
}
