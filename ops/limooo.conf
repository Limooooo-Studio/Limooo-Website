# Limooo - VPS Nginx 最小配置
#
# 公开站点已迁移到 Cloudflare Pages，本配置只保留仍必须留在 VPS 的部分：
#   - identity.limooo.cn / authentik
#   - 内网 backchannel logout（Docker -> nginx -> Flask）
# 其余子域即使因通配 DNS 落到 VPS，也由默认 server 直接拒绝。

# ── 日志过滤：444（封禁断连）不写入 access log ──────────
map $status $loggable {
    444    0;
    default 1;
}

# ── 非浏览器访问拦截：默认 403，放行浏览器/搜索引擎/合法自动化 ──
# $ua_deny=1 表示非浏览器 UA，由 location-security.inc 统一 403
map $http_user_agent $ua_deny {
    default 1;
    ~*Mozilla 0;
    ~*(hstspreload-bot|Cloudflare-Healthchecks|UptimeRobot|GoogleOther|Google-Extended) 0;
    ~*(Googlebot|Bingbot|Baiduspider|YandexBot|DuckDuckBot|Slurp|Sogou|360Spider|Bytespider|PetalBot|YisouSpider|Applebot|facebookexternalhit|Twitterbot|Discordbot|TelegramBot|Slackbot|AdsBot|Exabot|ia_archiver|Yeti) 0;
}

# ── WebSocket 升级与 keepalive ───────────────────────────
map $http_upgrade $connection_upgrade_keepalive {
    default upgrade;
    '' '';
}

upstream authentik_backend {
    server 127.0.0.1:9000;
    keepalive 16;
}

proxy_cache_path /var/cache/nginx/authentik
    levels=1:2
    keys_zone=authentik:10m
    max_size=256m
    inactive=30d
    use_temp_path=off;

# ── 访问日志格式：combined + CF-Ray ──────────────────
log_format limooo_cf '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_cf_ray"';

# ── Cloudflare 真实 IP 透传 ──────────────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── 全局 TLS 安全配置 ────────────────────────────────
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# ── 基础性能与安全头优化 ──────────────────────────────
server_tokens off;
tcp_nopush on;
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/wasm
    font/woff2
    image/svg+xml
    text/css
    text/plain;

# =========================================================
# 默认拒绝：未绑定域名的 HTTP/HTTPS 直接访问
# =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    include /etc/nginx/conf.d/location-security.inc;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    ssl_reject_handshake on;
}

# =========================================================
# identity.limooo.cn（authentik / OIDC IdP）
# =========================================================
server {
    listen 80;
    server_name identity.limooo.cn;
    include /etc/nginx/conf.d/location-security.inc;
    return 301 https://identity.limooo.cn$request_uri;
}

server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name identity.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    # 人机验证门禁：auth_request 校验 __gate cookie
    error_page 403 = @gate_redirect;
    location @gate_redirect {
        return 302 https://auth.limooo.cn/__gate?host=$host&next=$request_uri;
    }
    location = /__gate_check {
        internal;
        proxy_pass http://127.0.0.1:8080/__gate_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }
    auth_request /__gate_check;

    client_max_body_size 50m;

    # OIDC 协议端点由 Pages Worker / authentik 服务端调用，不能套门禁
    location /application/o/ {
        auth_request off;
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    # authentik 静态资源（不经门禁，避免子资源 302 循环）
    location /static/ {
        auth_request off;
        proxy_pass http://authentik_backend;
        proxy_cache authentik;
        proxy_cache_key $host$request_uri;
        proxy_cache_valid 200 1y;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        proxy_hide_header Vary;
        proxy_hide_header X-Authentik-Version;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    # authentik 实时推送：必须走 HTTP/1.1 + Upgrade，否则会反复重连
    location = /_health {
        auth_request off;
        return 200 "ok\n";
    }

    location /ws/ {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://authentik_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_cookie_flags authentik_session samesite=lax;
    }
}

# =========================================================
# admin.limooo.cn（Uptime Kuma 监控后台）
# =========================================================
server {
    listen 80;
    server_name admin.limooo.cn;
    include /etc/nginx/conf.d/location-security.inc;
    return 301 https://admin.limooo.cn$request_uri;
}

server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name admin.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 25m;

    location = /_health {
        return 200 "ok\n";
    }

    location = /limooo-admin-skin.css {
        alias /opt/uptime-kuma/kuma-admin-skin.css;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/css; charset=utf-8";
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# =========================================================
# 内网 backchannel logout：仅 Docker 网段/本机可达
# =========================================================
server {
    listen 0.0.0.0:8089;
    server_name _;

    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;

    location = /logout/backchannel {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host visitor.limooo.cn;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
    }
}
