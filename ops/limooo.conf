# ── 日志过滤：444（封禁断连）不写入 access log ──────────
map $status $loggable {
    444    0;
    default 1;
}

# ── 非浏览器访问拦截：默认 403，放行浏览器/搜索引擎/合法自动化 ──
# $ua_deny=1 表示非浏览器 UA，由 location-security.inc 统一 403
# （仅软性防御：UA 可被伪造，挡 curl/wget/python-requests 等“懒于伪装”的脚本）
map $http_user_agent $ua_deny {
    default 1;

    # 现代浏览器 UA 均含 Mozilla
    ~*Mozilla 0;

    # 合法自动化：HSTS preload 官方检测器 / Cloudflare 健康检查 / 监控
    ~*(hstspreload-bot|Cloudflare-Healthchecks|UptimeRobot|GoogleOther|Google-Extended) 0;

    # 搜索引擎爬虫（保留 SEO；多数含 Mozilla，此处兜底个别不含者）
    ~*(Googlebot|Bingbot|Baiduspider|YandexBot|DuckDuckBot|Slurp|Sogou|360Spider|Bytespider|PetalBot|YisouSpider|Applebot|facebookexternalhit|Twitterbot|Discordbot|TelegramBot|Slackbot|AdsBot|Exabot|ia_archiver|Yeti) 0;
}

# ── 访问日志格式：combined + CF-Ray ──────────────────
# Cloudflare 回源请求头带 CF-Ray（Ray ID），追加到日志末尾；
# 需要排查时可直接在源站 grep Ray ID 定位原始请求（IP/URI/状态码等）。
log_format limooo_cf '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_cf_ray"';

# ── Cloudflare 真实 IP 透传 ──────────────────────────
# 接入 Cloudflare 后回源流量来自 CF 边缘节点，仅信任 CF 网段的
# CF-Connecting-IP 头，确保自动封禁 / GeoIP 拿到访客真实 IP。
# 未接入 CF 时这些网段不会出现在直连流量里，此配置无副作用。
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── 全局 TLS 安全配置 ────────────────────────────────
# 只启用强密码套件（排除 CBC/CAMELLIA 等 WEAK 套件），开启 TLS 会话缓存
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
# 源站证书只用于 CF 回源，客户端不直连源站，无需 OCSP stapling

# =========================================================
# 1. 隐式安全护盾（排在最前，自动作为无匹配域名时的兜底配置）
# =========================================================

# 阻断所有未绑定的 HTTP 直接访问
server {
    listen 80;
    listen [::]:80;
    server_name _;
    include /etc/nginx/conf.d/location-security.inc;
    return 444; # 瞬间断开连接
}

# 阻断所有未绑定的 HTTPS 直接访问
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # 利用 Nginx 空证书拒绝机制，不泄露你真实的 limooo.cn 证书
    ssl_reject_handshake on;
}


# =========================================================
# 2. 全局强转：将正常域名的 HTTP 统一升级为 HTTPS
# =========================================================
server {
    listen 80;
    server_name services.limooo.cn contact.limooo.cn visitor.limooo.cn appleid.limooo.cn identity.limooo.cn redirect.limooo.cn images.limooo.cn;
    include /etc/nginx/conf.d/location-security.inc;
    return 301 https://$host$request_uri;
}

# 【裸域 HTTP】-> 一步直达 https://limooo.cn（主域）
server {
    listen 80;
    listen [::]:80;
    server_name limooo.cn;
    include /etc/nginx/conf.d/location-security.inc;
    return 301 https://limooo.cn$request_uri;
}

# 【www HTTP】-> 一步直达裸域 https://limooo.cn（www 并入主域）
server {
    listen 80;
    listen [::]:80;
    server_name www.limooo.cn;
    include /etc/nginx/conf.d/location-security.inc;
    return 301 https://limooo.cn$request_uri;
}


# =========================================================
# 3. 核心业务：独立子域名精准分流（不使用 Rewrite，告别死循环）
# =========================================================

# 【服务子域名】 -> 对应 Flask 的 /services 页面
server {
    listen 443 quic;
    listen 443 ssl;
    http2 on;
    server_name services.limooo.cn;

    ssl_certificate /etc/nginx/ssl/origin-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    include /etc/nginx/conf.d/location-security.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    access_log /var/log/nginx/access.log limooo_cf if=$loggable;

    # API 请求直通 Flask 根路由（语言字典 /api/i18n 等）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080/services;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

